defaults:
  - ../../configs/base/grpo_sliding_puzzle.yaml
  - ../../configs/models/qwen3.5-9b.yaml
  - ../../configs/base/grpo_megatron.yaml
  - ../../configs/base/grpo_lora.yaml

policy:
  model_name: "Qwen/Qwen3.5-9B-Base"
  tokenizer:
    name: "Qwen/Qwen3.5-9B-Base"
  max_total_sequence_length: 8192
  train_global_batch_size: 32
  generation_batch_size: 16
  generation:
    max_new_tokens: 1536
    temperature: 0.8
    top_p: 0.9
    top_k: 20
    stop_strings: null
    vllm_cfg:
      gpu_memory_utilization: 0.6

grpo:
  num_prompts_per_step: 8
  num_generations_per_prompt: 4
  max_rollout_turns: 5
  max_num_steps: 40
  val_period: 10
  val_at_start: true
  val_at_end: true
  max_val_samples: 64
  val_batch_size: 16

loss_fn:
  reference_policy_kl_penalty: 0.02

checkpointing:
  enabled: true
  save_period: 10

data:
  shuffle: true
  input_key: query
  output_key: expected_answer
  data_dir: /data/datasets/qa_rl
  system_prompt: |-
    你正在完成技术培训考试，可以真实检索公司内部资料。
    需要资料时，直接且仅输出 <search>题目中的技术名词和限定词</search>；不要解释检索动作，不要在思考中书写标签，不要伪造检索结果。
    收到 <search_results> 后只依据资料判断，信息足够就立即作答。最多检索两次；第二次后必须提交答案，即使资料不完整也要作出最合理判断。
    最终回答最多两句分析并以题目指定的 \boxed{} 结束，不要复述资料或规则。
    单选和判断只填一个字母，多选按字母顺序用逗号分隔，填空和简答用分号分隔。

env:
  _override_: true
  qa_search:
    cfg:
      docs_dir: /data/docs
      top_k: 4
      chunk_chars: 1000
      overlap_chars: 150
      max_result_chars: 1800
      max_file_bytes: 2000000
      max_searches: 2
      max_turns: 5
      k1: 1.5
      b: 0.75
      use_judge: true
      format_penalty: -0.5
      first_search_reward: 0.05

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 6
