defaults:
  - ../../configs/base/grpo_sliding_puzzle.yaml
  - ../../configs/models/qwen3.5-9b.yaml
  - ../../configs/base/grpo_megatron.yaml
  - ../../configs/base/grpo_lora.yaml

policy:
  model_name: "Qwen/Qwen3.5-9B-Base"
  tokenizer:
    name: "Qwen/Qwen3.5-9B-Base"
  max_total_sequence_length: 4096
  train_global_batch_size: 8
  generation_batch_size: 8
  generation:
    max_new_tokens: 1536
    temperature: 1.0
    top_p: 0.95
    top_k: 50
    stop_strings: null
    vllm_cfg:
      gpu_memory_utilization: 0.6

grpo:
  num_prompts_per_step: 1
  num_generations_per_prompt: 8
  max_rollout_turns: 3
  max_num_steps: 1
  val_period: 100
  val_at_start: true
  val_at_end: true
  max_val_samples: 16
  val_batch_size: 8

loss_fn:
  reference_policy_kl_penalty: 0.01

checkpointing:
  enabled: false

data:
  shuffle: true
  input_key: query
  output_key: expected_answer
  data_dir: /data/datasets/qa_rl
  system_prompt: |-
    你正在完成技术培训考试。你可以先检索内部技术资料，也可以直接回答。
    检索时只输出 <search>简洁关键词</search>，每次只检索一个主题，最多检索两次。
    信息足够后必须提交最终答案，并严格使用题目要求的 \boxed{...} 格式。
    单选和判断只填一个字母，多选按字母顺序用逗号分隔，填空和简答用分号分隔。

env:
  _override_: true
  qa_search:
    cfg:
      docs_dir: /data/docs
      top_k: 3
      chunk_chars: 1000
      overlap_chars: 150
      max_result_chars: 2600
      max_file_bytes: 2000000
      max_searches: 2
      max_turns: 3
      k1: 1.5
      b: 0.75
      use_judge: false
      format_penalty: -0.5

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  swanlab_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 3
